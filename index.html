<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本47都道府縣挑戰</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://unpkg.com/topojson-client@3"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
      background: #0f1117;
      color: #e8eaf0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      padding: 12px 20px;
      background: #161b27;
      border-bottom: 1px solid #252d3d;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    header h1 { font-size: 16px; font-weight: 700; white-space: nowrap; }

    .progress-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .progress-bar {
      flex: 1;
      background: #252d3d;
      border-radius: 99px;
      height: 7px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4f8ef7, #a78bfa);
      border-radius: 99px;
      transition: width 0.4s ease;
      width: 0%;
    }

    .progress-text { font-size: 12px; color: #8892a4; white-space: nowrap; }

    .header-btns { display: flex; gap: 8px; }

    .hbtn {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid #2e3a50;
      background: transparent;
      color: #c8d0e0;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }

    .hbtn:hover { background: #1e2535; color: #fff; }
    .hbtn.primary { background: #4f8ef7; border-color: #4f8ef7; color: #fff; }
    .hbtn.primary:hover { background: #3d7de6; }

    /* ── Layout ── */
    .main { display: flex; flex: 1; overflow: hidden; }

    /* ── Map ── */
    .map-area {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #0d111a;
    }

    #map-svg {
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    #map-svg:active { cursor: grabbing; }

    .prefecture {
      stroke: #1e2535;
      stroke-width: 0.6;
      cursor: pointer;
      transition: stroke 0.15s, stroke-width 0.15s;
    }

    .prefecture.unvisited { fill: #2a3248; }
    .prefecture.visited { fill: #2d5a3d; }
    .prefecture.active { stroke: #ffffff; stroke-width: 2; }
    .prefecture:hover { stroke: #a0aec0; stroke-width: 1.2; }

    /* ── Zoom controls ── */
    .zoom-controls {
      position: absolute;
      bottom: 20px;
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .zbtn {
      width: 32px;
      height: 32px;
      background: #161b27;
      border: 1px solid #252d3d;
      border-radius: 6px;
      color: #c8d0e0;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .zbtn:hover { background: #1e2535; color: #fff; }

    /* ── Loading ── */
    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      color: #8892a4;
      font-size: 14px;
      background: #0d111a;
      z-index: 10;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #252d3d;
      border-top-color: #4f8ef7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Tooltip ── */
    .tooltip {
      position: fixed;
      background: #1e2535dd;
      border: 1px solid #2e3a50;
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 13px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s;
      z-index: 200;
      backdrop-filter: blur(4px);
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 270px;
      background: #161b27;
      border-left: 1px solid #252d3d;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .sidebar-scroll::-webkit-scrollbar { width: 4px; }
    .sidebar-scroll::-webkit-scrollbar-track { background: transparent; }
    .sidebar-scroll::-webkit-scrollbar-thumb { background: #252d3d; border-radius: 2px; }

    .sidebar-empty {
      color: #3a4560;
      font-size: 13px;
      text-align: center;
      margin-top: 80px;
      line-height: 2;
    }

    .pref-header { margin-bottom: 16px; }
    .pref-ja { font-size: 24px; font-weight: 700; }
    .pref-en { font-size: 12px; color: #8892a4; margin-top: 2px; }

    .visited-tag {
      display: inline-block;
      background: #1a3d28;
      color: #4ade80;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 99px;
      margin-bottom: 12px;
    }

    /* Photo box */
    .photo-box {
      width: 100%;
      aspect-ratio: 4/3;
      background: #1a1f2e;
      border: 2px dashed #2a3450;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      position: relative;
      transition: border-color 0.2s;
    }

    .photo-box:hover { border-color: #4f8ef7; }

    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .photo-box.has-photo { border-style: solid; border-color: #2a3450; }
    .photo-box.has-photo img { display: block; }
    .photo-box.has-photo .upload-hint { display: none; }

    .upload-hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: #3a4560;
      font-size: 13px;
      pointer-events: none;
    }

    .upload-icon { font-size: 30px; }

    .photo-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .photo-box.has-photo:hover .photo-overlay { display: flex; }

    .obtn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.35);
      color: #fff;
      padding: 5px 12px;
      border-radius: 5px;
      font-size: 12px;
      cursor: pointer;
    }

    .obtn:hover { background: rgba(255,255,255,0.25); }

    .field-label {
      font-size: 11px;
      color: #8892a4;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin: 16px 0 6px;
    }

    .memo-input {
      width: 100%;
      background: #1a1f2e;
      border: 1px solid #2a3450;
      border-radius: 6px;
      color: #e8eaf0;
      font-size: 13px;
      padding: 8px 10px;
      resize: none;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
      line-height: 1.5;
    }

    .memo-input:focus { border-color: #4f8ef7; }

    .save-btn {
      margin-top: 12px;
      width: 100%;
      padding: 9px;
      background: linear-gradient(135deg, #4f8ef7, #a78bfa);
      border: none;
      border-radius: 7px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .save-btn:hover { opacity: 0.85; }

    .delete-btn {
      margin-top: 6px;
      width: 100%;
      padding: 7px;
      background: transparent;
      border: 1px solid #3a2535;
      border-radius: 7px;
      color: #f87171;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .delete-btn:hover { background: #2a1520; }

    /* visited strip */
    .visited-strip {
      border-top: 1px solid #1e2535;
      padding: 14px 20px;
      flex-shrink: 0;
    }

    .visited-strip-label {
      font-size: 11px;
      color: #8892a4;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 8px;
    }

    .thumb-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      max-height: 80px;
      overflow-y: auto;
    }

    .thumb-grid::-webkit-scrollbar { width: 3px; }
    .thumb-grid::-webkit-scrollbar-thumb { background: #252d3d; border-radius: 2px; }

    .thumb {
      width: 34px;
      height: 34px;
      border-radius: 5px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid #1e2535;
      flex-shrink: 0;
      background: #1a2030;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      color: #4a5568;
      text-align: center;
      line-height: 1.2;
    }

    .thumb img { width: 100%; height: 100%; object-fit: cover; }

    #file-input { display: none; }

    /* ── Mobile (≤640px) ── */
    @media (max-width: 640px) {
      header { padding: 8px 12px; gap: 10px; }
      header h1 { font-size: 13px; }
      .hbtn { padding: 5px 8px; font-size: 11px; }
      .progress-text { display: none; }

      .main { flex-direction: column; position: relative; }

      .map-area { flex: 1; min-height: 0; }

      /* sidebar → bottom sheet */
      .sidebar {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        width: 100%;
        border-left: none;
        border-top: 1px solid #252d3d;
        border-radius: 16px 16px 0 0;
        max-height: 55vh;
        transform: translateY(100%);
        transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
        z-index: 50;
        box-shadow: 0 -8px 32px rgba(0,0,0,0.5);
      }

      .sidebar.open { transform: translateY(0); }

      .sidebar-scroll { padding: 14px 16px; }

      /* drag handle */
      .sidebar::before {
        content: '';
        display: block;
        width: 36px;
        height: 4px;
        background: #2e3a50;
        border-radius: 2px;
        margin: 10px auto 2px;
        flex-shrink: 0;
      }

      /* smaller photo box on mobile */
      .photo-box { aspect-ratio: 16/7; }

      /* visited strip stays hidden on mobile (space-saving) */
      .visited-strip { display: none; }

      /* close button */
      .mobile-close {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding: 0 16px 4px;
      }

      .mobile-close-btn {
        background: none;
        border: none;
        color: #8892a4;
        font-size: 20px;
        cursor: pointer;
        padding: 4px 8px;
      }

      .zoom-controls { bottom: 12px; left: 12px; }
      .zbtn { width: 28px; height: 28px; font-size: 14px; }

      .pref-ja { font-size: 20px; }
    }

    /* hide mobile-close on desktop */
    .mobile-close { display: none; }
  </style>
</head>
<body>

<header>
  <h1>🗾 日本47都道府縣</h1>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="progress-text" id="progress-text">0 / 47</div>
  </div>
  <div class="header-btns">
    <button class="hbtn" id="export-svg-btn">輸出 SVG</button>
    <button class="hbtn primary" id="export-png-btn">輸出 PNG</button>
  </div>
</header>

<div class="main">
  <div class="map-area">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <span>載入地圖中...</span>
    </div>

    <svg id="map-svg">
      <defs id="svg-defs"></defs>
      <g id="map-g"></g>
    </svg>

    <div class="zoom-controls">
      <button class="zbtn" id="zoom-in-btn" title="放大">＋</button>
      <button class="zbtn" id="zoom-reset-btn" title="重設">⊡</button>
      <button class="zbtn" id="zoom-out-btn" title="縮小">－</button>
    </div>
  </div>

  <div class="sidebar" id="sidebar">
    <div class="mobile-close">
      <button class="mobile-close-btn" id="mobile-close-btn">✕</button>
    </div>
    <div class="sidebar-scroll" id="sidebar-scroll">
      <div class="sidebar-empty">點擊地圖上的<br>都道府縣開始記錄 ✦</div>
    </div>
    <div class="visited-strip">
      <div class="visited-strip-label">已造訪</div>
      <div class="thumb-grid" id="thumb-grid"></div>
    </div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>
<input type="file" id="file-input" accept="image/*">

<script>
const STORAGE_KEY = 'japan_challenge_v2';
const TOPOJSON_URL = 'https://raw.githubusercontent.com/dataofjapan/land/master/japan.topojson';

const PREF_JA = {
  1:'北海道',2:'青森県',3:'岩手県',4:'宮城県',5:'秋田県',
  6:'山形県',7:'福島県',8:'茨城県',9:'栃木県',10:'群馬県',
  11:'埼玉県',12:'千葉県',13:'東京都',14:'神奈川県',15:'新潟県',
  16:'富山県',17:'石川県',18:'福井県',19:'山梨県',20:'長野県',
  21:'岐阜県',22:'静岡県',23:'愛知県',24:'三重県',25:'滋賀県',
  26:'京都府',27:'大阪府',28:'兵庫県',29:'奈良県',30:'和歌山県',
  31:'鳥取県',32:'島根県',33:'岡山県',34:'広島県',35:'山口県',
  36:'徳島県',37:'香川県',38:'愛媛県',39:'高知県',40:'福岡県',
  41:'佐賀県',42:'長崎県',43:'熊本県',44:'大分県',45:'宮崎県',
  46:'鹿児島県',47:'沖縄県'
};

let db = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
let selectedId = null;
let pendingUploadId = null;
let zoomBehavior = null;
let currentTransform = d3.zoomIdentity;

function saveDB() { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }

function visitedCount() {
  return Object.keys(db).filter(k => db[k] && (db[k].photo || db[k].memo)).length;
}

function updateProgress() {
  const n = visitedCount();
  document.getElementById('progress-text').textContent = `${n} / 47`;
  document.getElementById('progress-fill').style.width = `${(n/47)*100}%`;
}

function updateThumbs() {
  const grid = document.getElementById('thumb-grid');
  grid.innerHTML = '';
  Object.entries(db).forEach(([id, d]) => {
    if (!d || (!d.photo && !d.memo)) return;
    const div = document.createElement('div');
    div.className = 'thumb';
    div.title = PREF_JA[id] || id;
    if (d.photo) {
      const img = document.createElement('img');
      img.src = d.photo;
      div.appendChild(img);
    } else {
      div.textContent = (PREF_JA[id] || '').replace(/[都道府県]/g,'');
    }
    div.addEventListener('click', () => selectPref(String(id)));
    grid.appendChild(div);
  });
}

// ── SVG pattern for photo fill ──────────────────────────────
function applyPhotoPattern(id, photoUrl) {
  const defs = document.getElementById('svg-defs');

  // Remove old pattern
  const old = document.getElementById(`pat-${id}`);
  if (old) old.remove();

  if (!photoUrl) {
    // Reset to color fill
    const path = document.querySelector(`[data-id="${id}"]`);
    if (path) {
      path.style.fill = '';
      const d = db[id];
      path.classList.toggle('visited', !!(d && d.memo));
      path.classList.toggle('unvisited', !(d && d.memo));
    }
    return;
  }

  const path = document.querySelector(`[data-id="${id}"]`);
  if (!path) return;

  const bbox = path.getBBox();

  const pattern = document.createElementNS('http://www.w3.org/2000/svg', 'pattern');
  pattern.setAttribute('id', `pat-${id}`);
  pattern.setAttribute('patternUnits', 'userSpaceOnUse');
  pattern.setAttribute('x', bbox.x);
  pattern.setAttribute('y', bbox.y);
  pattern.setAttribute('width', bbox.width);
  pattern.setAttribute('height', bbox.height);

  const img = document.createElementNS('http://www.w3.org/2000/svg', 'image');
  img.setAttribute('href', photoUrl);
  img.setAttribute('x', 0);
  img.setAttribute('y', 0);
  img.setAttribute('width', bbox.width);
  img.setAttribute('height', bbox.height);
  img.setAttribute('preserveAspectRatio', 'xMidYMid slice');

  pattern.appendChild(img);
  defs.appendChild(pattern);

  path.style.fill = `url(#pat-${id})`;
  path.classList.remove('visited', 'unvisited');
}

function restoreAllPhotos() {
  Object.entries(db).forEach(([id, d]) => {
    if (d && d.photo) applyPhotoPattern(id, d.photo);
    else if (d && d.memo) {
      const path = document.querySelector(`[data-id="${id}"]`);
      if (path) { path.classList.add('visited'); path.classList.remove('unvisited'); }
    }
  });
}

// ── Sidebar ─────────────────────────────────────────────────
function selectPref(id) {
  selectedId = id;
  d3.selectAll('.prefecture').classed('active', false);
  d3.select(`[data-id="${id}"]`).classed('active', true);
  document.getElementById('sidebar').classList.add('open');
  renderSidebar(id);
}

document.getElementById('mobile-close-btn').addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('open');
  d3.selectAll('.prefecture').classed('active', false);
  selectedId = null;
});

function renderSidebar(id) {
  const d = db[id] || {};
  const ja = PREF_JA[id] || '';
  const en = d.nam || '';
  const hasPhoto = !!d.photo;
  const visited = hasPhoto || !!d.memo;

  const wrap = document.getElementById('sidebar-scroll');
  wrap.innerHTML = `
    ${visited ? '<span class="visited-tag">✓ 已造訪</span>' : ''}
    <div class="pref-header">
      <div class="pref-ja">${ja}</div>
      ${en ? `<div class="pref-en">${en}</div>` : ''}
    </div>
    <div class="photo-box ${hasPhoto ? 'has-photo' : ''}" id="photo-box">
      <img src="${d.photo || ''}" id="photo-img" alt="">
      <div class="upload-hint">
        <div class="upload-icon">📷</div>
        <span>點擊上傳代表照片</span>
      </div>
      <div class="photo-overlay">
        <button class="obtn" id="change-btn">更換</button>
        <button class="obtn" id="rm-photo-btn">刪除</button>
      </div>
    </div>
    <div class="field-label">備忘 / 旅遊心得</div>
    <textarea class="memo-input" id="memo-input" rows="4" placeholder="記錄一下這裡的回憶...">${d.memo || ''}</textarea>
    <button class="save-btn" id="save-btn">儲存</button>
    ${visited ? '<button class="delete-btn" id="del-all-btn">清除這個縣的資料</button>' : ''}
  `;

  document.getElementById('photo-box').addEventListener('click', e => {
    if (e.target.id === 'change-btn' || e.target.id === 'rm-photo-btn') return;
    pendingUploadId = id;
    document.getElementById('file-input').click();
  });

  document.getElementById('change-btn')?.addEventListener('click', () => {
    pendingUploadId = id;
    document.getElementById('file-input').click();
  });

  document.getElementById('rm-photo-btn')?.addEventListener('click', () => {
    if (!db[id]) db[id] = {};
    delete db[id].photo;
    saveDB();
    applyPhotoPattern(id, null);
    updateProgress();
    updateThumbs();
    renderSidebar(id);
  });

  document.getElementById('save-btn').addEventListener('click', () => {
    if (!db[id]) db[id] = {};
    db[id].memo = document.getElementById('memo-input').value.trim();
    saveDB();
    const path = document.querySelector(`[data-id="${id}"]`);
    if (path && !db[id].photo) {
      path.classList.toggle('visited', !!db[id].memo);
      path.classList.toggle('unvisited', !db[id].memo);
    }
    updateProgress();
    updateThumbs();
    renderSidebar(id);
  });

  document.getElementById('del-all-btn')?.addEventListener('click', () => {
    delete db[id];
    saveDB();
    applyPhotoPattern(id, null);
    const path = document.querySelector(`[data-id="${id}"]`);
    if (path) { path.classList.add('unvisited'); path.classList.remove('visited', 'active'); path.style.fill = ''; }
    selectedId = null;
    updateProgress();
    updateThumbs();
    wrap.innerHTML = '<div class="sidebar-empty">點擊地圖上的<br>都道府縣開始記錄 ✦</div>';
  });
}

// ── File upload ──────────────────────────────────────────────
document.getElementById('file-input').addEventListener('change', function () {
  const file = this.files[0];
  if (!file || !pendingUploadId) return;
  const id = pendingUploadId;
  const reader = new FileReader();
  reader.onload = e => {
    if (!db[id]) db[id] = {};
    db[id].photo = e.target.result;
    saveDB();
    applyPhotoPattern(id, db[id].photo);
    updateProgress();
    updateThumbs();
    if (selectedId === id) renderSidebar(id);
    pendingUploadId = null;
  };
  reader.readAsDataURL(file);
  this.value = '';
});

// ── Tooltip ──────────────────────────────────────────────────
const tooltip = document.getElementById('tooltip');
document.addEventListener('mousemove', e => {
  tooltip.style.left = (e.clientX + 14) + 'px';
  tooltip.style.top  = (e.clientY - 32) + 'px';
});

// ── Export ───────────────────────────────────────────────────
function exportSVG() {
  const svgEl = document.getElementById('map-svg');
  const data = new XMLSerializer().serializeToString(svgEl);
  const blob = new Blob([data], { type: 'image/svg+xml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'japan_challenge.svg';
  a.click();
}

function exportPNG() {
  const svgEl = document.getElementById('map-svg');
  const w = svgEl.clientWidth, h = svgEl.clientHeight;
  const scale = 2;
  const data = new XMLSerializer().serializeToString(svgEl);
  const blob = new Blob([data], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = w * scale;
    canvas.height = h * scale;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#0d111a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(url);
    const a = document.createElement('a');
    a.download = 'japan_challenge.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  };
  img.onerror = () => {
    alert('PNG 輸出失敗（瀏覽器安全限制），請改用 SVG 輸出。');
    URL.revokeObjectURL(url);
  };
  img.src = url;
}

document.getElementById('export-svg-btn').addEventListener('click', exportSVG);
document.getElementById('export-png-btn').addEventListener('click', exportPNG);

// ── Map init ─────────────────────────────────────────────────
async function initMap() {
  const topo = await d3.json(TOPOJSON_URL);
  document.getElementById('loading').style.display = 'none';

  const features = topojson.feature(topo, topo.objects.japan).features;
  const svg = d3.select('#map-svg');
  const g   = d3.select('#map-g');
  const mapArea = document.querySelector('.map-area');

  function getSize() {
    return [mapArea.clientWidth, mapArea.clientHeight];
  }

  let projection, path;

  function buildProjection() {
    const [w, h] = getSize();
    projection = d3.geoMercator().fitSize([w, h], { type: 'FeatureCollection', features });
    path = d3.geoPath().projection(projection);
    svg.attr('viewBox', `0 0 ${w} ${h}`);
  }

  function render() {
    buildProjection();

    g.selectAll('path').remove();

    g.selectAll('path')
      .data(features)
      .enter()
      .append('path')
      .attr('class', d => {
        const id = String(d.properties.id || '');
        const rec = db[id];
        const visited = rec && (rec.photo || rec.memo);
        return `prefecture ${visited && !rec.photo ? 'visited' : visited ? '' : 'unvisited'}`;
      })
      .attr('data-id', d => String(d.properties.id || ''))
      .attr('data-nam', d => d.properties.nam || '')
      .attr('d', path)
      .on('mouseenter', (event, d) => {
        const id = String(d.properties.id || '');
        tooltip.textContent = `${PREF_JA[id] || ''} ${d.properties.nam || ''}`.trim();
        tooltip.style.opacity = 1;
      })
      .on('mouseleave', () => { tooltip.style.opacity = 0; })
      .on('click', (event, d) => {
        const id = String(d.properties.id || '');
        if (!db[id]) db[id] = { nam: d.properties.nam || '' };
        else if (!db[id].nam) db[id].nam = d.properties.nam || '';
        selectPref(id);
      });

    restoreAllPhotos();
    if (selectedId) d3.select(`[data-id="${selectedId}"]`).classed('active', true);
  }

  // D3 zoom
  zoomBehavior = d3.zoom()
    .scaleExtent([0.4, 20])
    .on('zoom', event => {
      currentTransform = event.transform;
      g.attr('transform', event.transform);
    });

  svg.call(zoomBehavior);

  document.getElementById('zoom-in-btn').addEventListener('click', () => {
    svg.transition().duration(300).call(zoomBehavior.scaleBy, 1.6);
  });
  document.getElementById('zoom-out-btn').addEventListener('click', () => {
    svg.transition().duration(300).call(zoomBehavior.scaleBy, 1 / 1.6);
  });
  document.getElementById('zoom-reset-btn').addEventListener('click', () => {
    svg.transition().duration(400).call(zoomBehavior.transform, d3.zoomIdentity);
  });

  render();

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      render();
      svg.call(zoomBehavior.transform, d3.zoomIdentity);
    }, 200);
  });

  updateProgress();
  updateThumbs();
}

initMap().catch(err => {
  document.getElementById('loading').innerHTML =
    `<span style="color:#f87171">地圖載入失敗，請確認網路連線。</span><br><small style="color:#4a5568">${err.message}</small>`;
});
</script>
</body>
